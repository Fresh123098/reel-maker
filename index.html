<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اردو کارٹون ریل اسٹوڈیو (Urdu Cartoon Reel Studio)</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
      direction: ltr;
    }
    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }
    h1 { color: #e91e63; text-align: center; }
    .step {
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0;
      background: #fafafa;
    }
    label { font-weight: bold; display: block; margin-top: 12px; }
    select, input[type="file"], button {
      font-size: 16px;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background: #e91e63;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #scriptOutput {
      background: #fff3e0;
      padding: 15px;
      border-radius: 10px;
      font-size: 18px;
      min-height: 80px;
      white-space: pre-wrap;
    }
    .character-pick {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .char-option {
      border: 3px solid transparent;
      border-radius: 16px;
      padding: 10px;
      cursor: pointer;
      text-align: center;
    }
    .char-option.selected { border-color: #e91e63; }
    .char-option img { width: 70px; height: 70px; }
    .speaker-row {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 12px;
      margin: 10px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .speaker-row img { width: 50px; height: 50px; border-radius: 50%; }
    .scene-preview {
      background: #2c3e50;
      color: white;
      padding: 16px;
      border-radius: 12px;
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .scene-preview img { width: 60px; height: 60px; }
    #progress { margin: 15px 0; font-weight: bold; }
    #downloadLink {
      display: none;
      text-align: center;
      margin: 20px 0;
      font-size: 18px;
      color: #e91e63;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🎬 اردو کارٹون ریل اسٹوڈیو</h1>
  <p style="text-align:center; color:#555;">خودکار کہانی + کردار + آپ کی آواز = ریل</p>

  <!-- STEP 1: Generate Script -->
  <div class="step">
    <h2>۱۔ کہانی (Story)</h2>
    <label for="theme">موضوع (Theme):</label>
    <select id="theme">
      <option value="funny">مضحکہ خیز (Funny)</option>
      <option value="moral">اخلاقی سبق (Moral)</option>
      <option value="islamic">اسلامی (Islamic)</option>
      <option value="friendship">دوستی (Friendship)</option>
    </select>
    <button id="generateScriptBtn">کہانی بنائیں</button>
    <div id="scriptOutput">یہاں کہانی نظر آئے گی...</div>
  </div>

  <!-- STEP 2: Assign Characters & Upload Voices -->
  <div class="step" id="assignmentStep" style="display:none;">
    <h2>۲۔ کردار اور آواز (Characters & Voices)</h2>
    <p>ہر بولنے والے کے لیے کردار چنیں اور اس کی آواز کی فائل اپ لوڈ کریں۔</p>
    <div id="charGlobalSelect">
      <label>سب کے لیے کردار منتخب کریں (یا ہر کردار الگ نیچے دیں):</label>
      <div class="character-pick" id="globalCharPicker"></div>
    </div>
    <div id="speakerAssignments"></div>
    <button id="previewScenesBtn">👁️ مناظر دیکھیں (Preview Scenes)</button>
    <div id="scenePreviews"></div>
  </div>

  <!-- STEP 3: Make Reel -->
  <div class="step" id="renderStep" style="display:none;">
    <h2>۳۔ ریل بنائیں</h2>
    <p>تمام مناظر تیار ہیں۔ نیچے بٹن دبائیں۔</p>
    <button id="makeReelBtn">✨ ریل بنائیں (Create Reel)</button>
    <div id="progress"></div>
    <a id="downloadLink" download="cartoon_reel.mp4">⬇️ ریل ڈاؤن لوڈ کریں</a>
  </div>
</div>

<!-- FFmpeg.wasm import map -->
<script type="importmap">
{
  "imports": {
    "@ffmpeg/ffmpeg": "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.6/dist/esm/index.js",
    "@ffmpeg/util": "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js"
  }
}
</script>

<script type="module">
import { FFmpeg } from '@ffmpeg/ffmpeg';
import { fetchFile, toBlobURL } from '@ffmpeg/util';

// ---------- STORY TEMPLATES ----------
const storyDB = {
  funny: [
    {speaker:"بچہ", text:"امی! آج میں نے ماسٹر جی کی کرسی غائب کر دی۔"},
    {speaker:"امی", text:"اچھا؟ اور پھر کیا ہوا؟"},
    {speaker:"بچہ", text:"وہ فرش پر بیٹھ گئے، پوری کلاس ہنس پڑی!"},
    {speaker:"امی", text:"شاباش! لیکن دوبارہ ایسا نہ کرنا۔"}
  ],
  moral: [
    {speaker:"دادا", text:"بیٹا، سچ بولنا بہادری ہے۔"},
    {speaker:"بچی", text:"دادا، لیکن کبھی کبھی سچ سے ڈر لگتا ہے۔"},
    {speaker:"دادا", text:"ڈر تب لگتا ہے جب ہم کمزور ہوں، سچ ہمیں طاقت دیتا ہے۔"}
  ],
  islamic: [
    {speaker:"بچہ", text:"ابو، اللہ ہمیں کیوں آزماتا ہے؟"},
    {speaker:"ابو", text:"تاکہ ہم صبر کریں اور جنت کے قریب ہوں۔"},
    {speaker:"بچہ", text:"پھر میں ہر مشکل میں صبر کروں گا ان شاء اللہ۔"}
  ],
  friendship: [
    {speaker:"لڑکا", text:"یار! آج دل بہت اُداس ہے۔"},
    {speaker:"دوست", text:"چلو چائے پیتے ہیں، میں سب بھول جاؤں گا۔"},
    {speaker:"لڑکا", text:"دوستی ہو تو ایسی ورنہ نہ ہو۔"}
  ]
};

// ---------- CARTOON CHARACTERS (inline SVG) ----------
const characters = {
  boy: {
    name:"لڑکا (Boy)",
    img:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='30' r='20' fill='%23ffcc80'/%3E%3Ccircle cx='42' cy='25' r='3' fill='%23000'/%3E%3Ccircle cx='58' cy='25' r='3' fill='%23000'/%3E%3Cpath d='M44 38 Q50 44 56 38' stroke='%23000' fill='none' stroke-width='2'/%3E%3Crect x='35' y='50' width='30' height='40' fill='%2342a5f5' rx='5'/%3E%3C/svg%3E"
  },
  girl: {
    name:"لڑکی (Girl)",
    img:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='30' r='20' fill='%23ffcc80'/%3E%3Ccircle cx='42' cy='25' r='3' fill='%23000'/%3E%3Ccircle cx='58' cy='25' r='3' fill='%23000'/%3E%3Cpath d='M44 38 Q50 44 56 38' stroke='%23000' fill='none' stroke-width='2'/%3E%3Cpath d='M28 20 L35 8 L42 20' fill='%23e91e63' /%3E%3Crect x='35' y='50' width='30' height='40' fill='%23f48fb1' rx='5'/%3E%3C/svg%3E"
  },
  man: {
    name:"آدمی (Man)",
    img:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='28' r='18' fill='%23e0ac69'/%3E%3Ccircle cx='43' cy='23' r='3' fill='%23000'/%3E%3Ccircle cx='57' cy='23' r='3' fill='%23000'/%3E%3Cpath d='M44 34 Q50 40 56 34' stroke='%23000' fill='none' stroke-width='2'/%3E%3Crect x='40' y='10' width='20' height='6' fill='%23333' /%3E%3Crect x='35' y='46' width='30' height='42' fill='%233f51b5' rx='5'/%3E%3C/svg%3E"
  },
  woman: {
    name:"عورت (Woman)",
    img:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='28' r='18' fill='%23e0ac69'/%3E%3Ccircle cx='43' cy='23' r='3' fill='%23000'/%3E%3Ccircle cx='57' cy='23' r='3' fill='%23000'/%3E%3Cpath d='M44 34 Q50 40 56 34' stroke='%23000' fill='none' stroke-width='2'/%3E%3Cpath d='M28 16 Q50 2 72 16' fill='%238d6e63' /%3E%3Crect x='35' y='46' width='30' height='42' fill='%23ec407a' rx='5'/%3E%3C/svg%3E"
  },
  grandpa: {
    name:"دادا (Grandpa)",
    img:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='28' r='18' fill='%23d7ccc8'/%3E%3Ccircle cx='43' cy='23' r='3' fill='%23000'/%3E%3Ccircle cx='57' cy='23' r='3' fill='%23000'/%3E%3Cpath d='M40 36 Q50 42 60 36' stroke='%23000' fill='none' stroke-width='2'/%3E%3Cpath d='M35 18 Q50 8 65 18' fill='%23bcaaa4' /%3E%3Crect x='35' y='46' width='30' height='42' fill='%23795548' rx='5'/%3E%3C/svg%3E"
  }
};

// ---------- GLOBAL STATE ----------
let scenes = [];              // {speaker, text, charKey, voiceFile}
let ffmpeg = null;
let ffmpegLoaded = false;
let globalChar = 'boy';       // default

// ---------- INITIALIZATION ----------
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('generateScriptBtn').addEventListener('click', generateScript);
  document.getElementById('previewScenesBtn').addEventListener('click', previewScenes);
  document.getElementById('makeReelBtn').addEventListener('click', makeReel);
  buildGlobalCharPicker();
});

function buildGlobalCharPicker() {
  const picker = document.getElementById('globalCharPicker');
  picker.innerHTML = '';
  for (let [key, ch] of Object.entries(characters)) {
    const div = document.createElement('div');
    div.className = 'char-option' + (key === globalChar ? ' selected' : '');
    div.dataset.char = key;
    div.innerHTML = `<img src="${ch.img}" alt="${ch.name}"><br>${ch.name}`;
    div.onclick = () => {
      document.querySelectorAll('#globalCharPicker .char-option').forEach(el => el.classList.remove('selected'));
      div.classList.add('selected');
      globalChar = key;
      // update per-speaker rows if already shown
      updateSpeakerRows();
    };
    picker.appendChild(div);
  }
}

// ---------- STEP 1: GENERATE SCRIPT ----------
function generateScript() {
  const theme = document.getElementById('theme').value;
  scenes = JSON.parse(JSON.stringify(storyDB[theme]));   // deep copy
  scenes.forEach(s => { s.charKey = globalChar; s.voiceFile = null; });
  document.getElementById('scriptOutput').innerHTML = scenes.map(s =>
    `<b>${s.speaker}:</b> ${s.text}`
  ).join('<br>');

  document.getElementById('assignmentStep').style.display = 'block';
  document.getElementById('renderStep').style.display = 'block';
  buildSpeakerAssignments();
}

// ---------- STEP 2: SPEAKER ROWS (upload voice for each) ----------
function buildSpeakerAssignments() {
  const container = document.getElementById('speakerAssignments');
  container.innerHTML = '<h3>ہر کردار کے لیے آواز کی فائل</h3>';
  // Get unique speakers
  const speakers = [...new Set(scenes.map(s => s.speaker))];
  speakers.forEach(speaker => {
    const div = document.createElement('div');
    div.className = 'speaker-row';
    const charImg = characters[globalChar]?.img || '';
    div.innerHTML = `
      <img src="${charImg}" alt="character">
      <b>${speaker}</b>
      <input type="file" accept="audio/*" class="voice-upload" data-speaker="${speaker}">
    `;
    container.appendChild(div);
  });
  // Update all scenes with current globalChar
  updateSpeakerRows();
}

function updateSpeakerRows() {
  scenes.forEach(scene => { scene.charKey = globalChar; });
  // Update images in speaker rows
  document.querySelectorAll('.speaker-row img').forEach(img => {
    img.src = characters[globalChar]?.img || '';
  });
}

// ---------- PREVIEW SCENES ----------
function previewScenes() {
  // First, attach uploaded files to scenes
  const fileInputs = document.querySelectorAll('.voice-upload');
  fileInputs.forEach(inp => {
    const speaker = inp.dataset.speaker;
    const file = inp.files[0];
    if (file) {
      scenes.filter(s => s.speaker === speaker).forEach(s => s.voiceFile = file);
    }
  });

  const previewDiv = document.getElementById('scenePreviews');
  previewDiv.innerHTML = '<h3>👁️ مناظر:</h3>';
  scenes.forEach((scene, i) => {
    const char = characters[scene.charKey];
    const div = document.createElement('div');
    div.className = 'scene-preview';
    div.innerHTML = `<img src="${char.img}" alt="${char.name}"> <span><b>${scene.speaker}:</b> ${scene.text}</span>`;
    previewDiv.appendChild(div);
  });
}

// ---------- STEP 3: CREATE REEL ----------
async function makeReel() {
  // Ensure voice files are assigned
  const fileInputs = document.querySelectorAll('.voice-upload');
  fileInputs.forEach(inp => {
    const speaker = inp.dataset.speaker;
    const file = inp.files[0];
    if (file) {
      scenes.filter(s => s.speaker === speaker).forEach(s => s.voiceFile = file);
    }
  });

  // Check all scenes have a voice file
  if (scenes.some(s => !s.voiceFile)) {
    alert('براہ کرم ہر کردار کے لیے آواز کی فائل اپ لوڈ کریں۔');
    return;
  }

  const progressDiv = document.getElementById('progress');
  const downloadLink = document.getElementById('downloadLink');
  downloadLink.style.display = 'none';

  if (!ffmpegLoaded) {
    progressDiv.textContent = 'FFmpeg لوڈ ہو رہا ہے (پہلی بار ~30MB)...';
    await loadFFmpeg();
  }

  try {
    // 1) Render scene images to Blobs
    const imageBlobs = [];
    progressDiv.textContent = 'مناظر کی تصاویر بنا رہے ہیں...';
    for (let i = 0; i < scenes.length; i++) {
      const blob = await renderSceneImage(scenes[i], i);
      imageBlobs.push(blob);
    }

    // 2) Write files to FFmpeg virtual FS
    progressDiv.textContent = 'ویڈیو بنا رہے ہیں...';
    for (let i = 0; i < scenes.length; i++) {
      const imgBlob = imageBlobs[i];
      const audioFile = scenes[i].voiceFile;
      await ffmpeg.writeFile(`scene${i}.png`, await fetchFile(imgBlob));
      await ffmpeg.writeFile(`audio${i}${getExtension(audioFile.name)}`, await fetchFile(audioFile));
    }

    // 3) Build filtergraph
    // For each scene: loop image for duration of audio
    // We need to get audio duration; we can use ffprobe or assume we decode. 
    // Simpler: use 'shortest' with concat and set image input durations equal to audio lengths.
    // We'll first probe audio durations using a temporary decode? 
    // Instead, we'll use a different approach: generate silent video of same length by using -t.
    // We need audio duration. Use Web Audio to decode the audio blobs and get duration.
    const durations = [];
    for (let i = 0; i < scenes.length; i++) {
      const audioFile = scenes[i].voiceFile;
      const audioCtx = new AudioContext();
      const arrayBuffer = await audioFile.arrayBuffer();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      durations.push(audioBuffer.duration);
      audioCtx.close();
    }

    // Build FFmpeg arguments: multiple inputs, concat filter
    let args = [];
    // inputs: for each scene, we add a looped image and an audio
    scenes.forEach((_, i) => {
      args.push('-loop', '1', '-t', durations[i].toFixed(3), '-i', `scene${i}.png`);
    });
    scenes.forEach((_, i) => {
      args.push('-i', `audio${i}${getExtension(scenes[i].voiceFile.name)}`);
    });

    // filter complex: concat video streams, concat audio streams
    let videoInputs = '';
    let audioInputs = '';
    for (let i = 0; i < scenes.length; i++) {
      videoInputs += `[${i}:v]`;
      audioInputs += `[${scenes.length + i}:a]`;
    }
    const filter = `${videoInputs}concat=n=${scenes.length}:v=1:a=0[outv]; ${audioInputs}concat=n=${scenes.length}:v=0:a=1[outa]`;
    args.push('-filter_complex', filter);
    args.push('-map', '[outv]', '-map', '[outa]');
    args.push('-c:v', 'libx264', '-preset', 'ultrafast', '-pix_fmt', 'yuv420p');
    args.push('-shortest');
    args.push('output.mp4');

    progressDiv.textContent = 'FFmpeg چل رہا ہے...';
    await ffmpeg.exec(args);

    const data = await ffmpeg.readFile('output.mp4');
    const blob = new Blob([data.buffer], { type: 'video/mp4' });
    const url = URL.createObjectURL(blob);
    downloadLink.href = url;
    downloadLink.style.display = 'block';
    progressDiv.textContent = '✔️ ریل تیار ہے! اوپر لنک سے ڈاؤن لوڈ کریں۔';
  } catch (err) {
    progressDiv.textContent = '❌ خرابی: ' + err.message;
  } finally {
    // Clean up virtual FS
    try { for (let i=0;i<scenes.length;i++) await ffmpeg.deleteFile(`scene${i}.png`); } catch(e){}
    try { for (let i=0;i<scenes.length;i++) await ffmpeg.deleteFile(`audio${i}${getExtension(scenes[i].voiceFile.name)}`); } catch(e){}
    try { await ffmpeg.deleteFile('output.mp4'); } catch(e){}
  }
}

function getExtension(filename) {
  const p = filename.lastIndexOf('.');
  return p >= 0 ? filename.substring(p) : '.mp3';
}

async function loadFFmpeg() {
  ffmpeg = new FFmpeg();
  const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';
  await ffmpeg.load({
    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
  });
  ffmpegLoaded = true;
}

async function renderSceneImage(scene, index) {
  // Create a canvas that represents the vertical reel (1080x1920)
  const canvas = document.createElement('canvas');
  canvas.width = 1080;
  canvas.height = 1920;
  const ctx = canvas.getContext('2d');

  // Background gradient
  const gradient = ctx.createLinearGradient(0, 0, 0, 1920);
  gradient.addColorStop(0, '#1a237e');
  gradient.addColorStop(1, '#4a148c');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 1080, 1920);

  // Load character image from data URL
  const charImg = new Image();
  charImg.src = characters[scene.charKey].img;
  await new Promise((resolve, reject) => {
    charImg.onload = resolve;
    charImg.onerror = reject;
  });
  // Draw character centred, large
  const charSize = 600;
  ctx.drawImage(charImg, (1080 - charSize)/2, 300, charSize, charSize);

  // Text (Urdu dialogue) at bottom
  ctx.fillStyle = 'white';
  ctx.font = 'bold 70px "Noto Nastaliq Urdu", "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.direction = 'rtl';
  wrapText(ctx, scene.text, 1080/2, 1400, 1000, 90);

  // Speaker name top
  ctx.font = '60px "Noto Nastaliq Urdu", sans-serif';
  ctx.fillStyle = '#ffeb3b';
  ctx.fillText(scene.speaker, 1080/2, 150);

  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n] + ' ';
    const metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth && n > 0) {
      ctx.fillText(line, x, y);
      line = words[n] + ' ';
      y += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, y);
}
</script>
