function buildCharSVG({head='round', hair='short', skin='#f8c291', outfit='shirt', outfitColor='#3f51b5'}) {
  const headShape = head === 'round' 
    ? `<circle cx="50" cy="35" r="18" fill="${skin}" stroke="#333" stroke-width="1.5"/>`
    : `<ellipse cx="50" cy="35" rx="16" ry="20" fill="${skin}" stroke="#333" stroke-width="1.5"/>`;

  if (hair === 'short') hairSVG = `<path d="M28 30 Q50 10 72 30" fill="#5d4037" stroke="#333" stroke-width="1"/>`;
  else if (hair === 'long') hairSVG = `<path d="M28 30 Q50 10 72 30" fill="#5d4037" stroke="#333" stroke-width="1"/><rect x="25" y="18" width="10" height="20" fill="#5d4037" rx="3"/>`;
  let outfitSVG = '';

// =================== meSpeak SETUP ===================
function loadUrduVoice() {
  return new Promise((resolve, reject) => {
    if (meSpeakReady) return resolve();
    // Load meSpeak config (default)
    meSpeak.loadConfig({
      amph: 100, pitch: 50, speed: 145, wordgap: 5, variant: 'f'
    });
    // Fetch the Urdu voice from the official CDN
    const voiceURL = 'https://cdn.jsdelivr.net/gh/kripken/speak.js@master/voices/ur.json';
    fetch(voiceURL)
      .then(res => res.json())
      .then(voiceData => {
        meSpeak.loadVoice(voiceData, () => {
          meSpeakReady = true;
          resolve();
        });
      })
      .catch(err => {
        reject('Failed to load Urdu voice. Check your internet connection.');
      });
  });
}

// Generate speech audio from text using meSpeak
async function generateTTSAudio(text) {
  await loadUrduVoice();
  return new Promise((resolve) => {
    // meSpeak.speak returns a base64 WAV data URI
    const base64 = meSpeak.speak(text, { rawdata: 'data-url' });
    // Convert data URI to Blob
    const byteString = atob(base64.split(',')[1]);
    const mimeString = 'audio/wav';
    const ab = new ArrayBuffer(byteString.length);
    const ia = new Uint8Array(ab);
    for (let i = 0; i < byteString.length; i++) {
      ia[i] = byteString.charCodeAt(i);
    }
    const blob = new Blob([ab], { type: mimeString });
    resolve(blob);
  });
}

// =================== REST OF THE CODE (similar to previous, using generateTTSAudio) ===================
async function tryAutoVoice() {
  if (!meSpeakReady) {
    try { await loadUrduVoice(); } catch(e) { alert(e); return; }

  const status = document.querySelector('#voiceStatus') || { innerHTML: '' };
  status.innerHTML = 'Generating voice...';
  autoAudioBlobs = [];
  for (let i = 0; i < scenes.length; i++) {
    const blob = await generateTTSAudio(scenes[i].text);
    autoAudioBlobs.push(blob);
  }
  status.innerHTML = '✔️ Auto voice ready!';
  voiceMode = 'auto';
  alert('Urdu voiceover generated! Now you can create the reel.');
}
