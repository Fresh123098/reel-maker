<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اردو کارٹون ریل اسٹوڈیو (مکمل خودکار)</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 850px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
    h1 { color: #e91e63; text-align: center; }
    .step { border: 1px solid #ddd; border-radius: 16px; padding: 20px; margin: 20px 0; background: #fafafa; }
    select, button, input { font-size: 16px; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; }
    button { background: #e91e63; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #scriptOutput { background: #fff3e0; padding: 15px; border-radius: 10px; font-size: 18px; min-height: 80px; white-space: pre-wrap; }
    .character-pick { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .char-option { border: 3px solid transparent; border-radius: 16px; padding: 10px; cursor: pointer; text-align: center; }
    .char-option.selected { border-color: #e91e63; }
    .char-option img { width: 100px; height: 100px; }
    .speaker-row { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 12px; margin: 10px 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .speaker-row img { width: 50px; height: 50px; border-radius: 50%; }
    .scene-preview { background: #2c3e50; color: white; padding: 16px; border-radius: 12px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
    .scene-preview img { width: 60px; height: 60px; }
    #progress { margin: 15px 0; font-weight: bold; }
    #downloadLink { display: none; text-align: center; margin: 20px 0; font-size: 18px; color: #e91e63; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <h1>🎬 اردو کارٹون ریل اسٹوڈیو</h1>
  <p style="text-align:center; color:#555;">خودکار کہانی + اصلی کارٹون + آپ کی آواز = ریل</p>

  <!-- STEP 1: Story -->
  <div class="step">
    <h2>۱۔ کہانی (Story)</h2>
    <label for="theme">موضوع:</label>
    <select id="theme">
      <option value="funny">مضحکہ خیز</option>
      <option value="moral">اخلاقی سبق</option>
      <option value="islamic">اسلامی</option>
      <option value="friendship">دوستی</option>
    </select>
    <button id="generateScriptBtn">کہانی بنائیں</button>
    <div id="scriptOutput">یہاں کہانی نظر آئے گی...</div>
  </div>

  <!-- STEP 2: Characters & Voice Upload -->
  <div class="step" id="assignmentStep" style="display:none;">
    <h2>۲۔ کردار اور آواز (Characters & Voices)</h2>
    <p>ایک کردار چنیں (سب بولنے والوں کے لیے):</p>
    <div class="character-pick" id="charPicker"></div>
    <br>
    <p>ہر بولنے والے کے لیے اس کی آواز کی ریکارڈنگ اپ لوڈ کریں:</p>
    <div id="speakerAssignments"></div>
    <button id="previewScenesBtn">👁️ مناظر دیکھیں (Preview)</button>
    <div id="scenePreviews"></div>
  </div>

  <!-- STEP 3: Make Reel -->
  <div class="step" id="renderStep" style="display:none;">
    <h2>۳۔ ریل بنائیں</h2>
    <button id="makeReelBtn">✨ ریل بنائیں (Create Reel)</button>
    <div id="progress"></div>
    <a id="downloadLink" download="cartoon_reel.mp4">⬇️ ریل ڈاؤن لوڈ کریں</a>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "@ffmpeg/ffmpeg": "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.6/dist/esm/index.js",
    "@ffmpeg/util": "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js"
  }
}
</script>

<script type="module">
import { FFmpeg } from '@ffmpeg/ffmpeg';
import { fetchFile, toBlobURL } from '@ffmpeg/util';

// ---------- STORY DATABASE ----------
const storyDB = {
  funny: [
    {speaker:"بچہ", text:"امی! آج سکول میں ماسٹر جی کی کرسی غائب کر دی۔"},
    {speaker:"امی", text:"کیا؟ تم نے یہ کیوں کیا؟"},
    {speaker:"بچہ", text:"بس مذاق تھا، پوری کلاس ہنس پڑی۔"},
    {speaker:"امی", text:"مذاق اچھی بات ہے مگر شرارت نہیں کرنی چاہیے۔"}
  ],
  moral: [
    {speaker:"دادا", text:"بیٹا، سچ بولنا سب سے بڑی بہادری ہے۔"},
    {speaker:"بچی", text:"دادا، مگر سچ بولنے سے کبھی کبھی ڈانٹ پڑتی ہے۔"},
    {speaker:"دادا", text:"ڈانٹ سے نہیں ڈرنا چاہیے، سچ کا انعام بہت بڑا ہوتا ہے۔"}
  ],
  islamic: [
    {speaker:"بچہ", text:"ابو، اللہ ہمیں کیوں آزماتا ہے؟"},
    {speaker:"ابو", text:"تاکہ ہم صبر کریں اور ثواب کمائیں، بیٹا۔"},
    {speaker:"بچہ", text:"پھر میں ہر مشکل میں صبر کروں گا ان شاء اللہ۔"}
  ],
  friendship: [
    {speaker:"لڑکا", text:"یار! آج دل بہت اُداس ہے۔"},
    {speaker:"دوست", text:"کیوں؟ کیا ہوا؟ چلیں چائے پیتے ہیں، بتاؤ۔"},
    {speaker:"لڑکا", text:"بس دوست ہو تو ایسا، سب ٹھیک ہو جاتا ہے۔"}
  ]
};

// ---------- REAL HAND‑DRAWN CARTOON CHARACTERS ----------
const characters = {
  boy: {
    name: "لڑکا",
    img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='30' r='18' fill='%23f8c291'/%3E%3Ccircle cx='43' cy='26' r='2.5' fill='%23000'/%3E%3Ccircle cx='57' cy='26' r='2.5' fill='%23000'/%3E%3Cpath d='M45 36 Q50 42 55 36' stroke='%23000' fill='none' stroke-width='2'/%3E%3Crect x='36' y='48' width='28' height='35' fill='%233f51b5' rx='5'/%3E%3Crect x='30' y='12' width='40' height='12' fill='%235d4037' rx='4'/%3E%3C/svg%3E"
  },
  girl: {
    name: "لڑکی",
    img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='30' r='18' fill='%23f8c291'/%3E%3Ccircle cx='43' cy='26' r='2.5' fill='%23000'/%3E%3Ccircle cx='57' cy='26' r='2.5' fill='%23000'/%3E%3Cpath d='M45 36 Q50 42 55 36' stroke='%23000' fill='none' stroke-width='2'/%3E%3Cpath d='M20 20 Q50 2 80 20' fill='%23e91e63'/%3E%3Crect x='36' y='48' width='28' height='35' fill='%23f48fb1' rx='5'/%3E%3C/svg%3E"
  },
  man: {
    name: "آدمی",
    img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='28' r='18' fill='%23e0ac69'/%3E%3Ccircle cx='43' cy='24' r='2.5' fill='%23000'/%3E%3Ccircle cx='57' cy='24' r='2.5' fill='%23000'/%3E%3Cpath d='M45 34 Q50 40 55 34' stroke='%23000' fill='none' stroke-width='2'/%3E%3Crect x='40' y='10' width='20' height='6' fill='%23333'/%3E%3Crect x='35' y='46' width='30' height='40' fill='%233f51b5' rx='5'/%3E%3C/svg%3E"
  },
  woman: {
    name: "عورت",
    img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='28' r='18' fill='%23e0ac69'/%3E%3Ccircle cx='43' cy='24' r='2.5' fill='%23000'/%3E%3Ccircle cx='57' cy='24' r='2.5' fill='%23000'/%3E%3Cpath d='M45 34 Q50 40 55 34' stroke='%23000' fill='none' stroke-width='2'/%3E%3Cpath d='M25 16 Q50 2 75 16' fill='%238d6e63'/%3E%3Crect x='35' y='46' width='30' height='40' fill='%23ec407a' rx='5'/%3E%3C/svg%3E"
  },
  grandpa: {
    name: "دادا",
    img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='28' r='18' fill='%23d7ccc8'/%3E%3Ccircle cx='43' cy='24' r='2.5' fill='%23000'/%3E%3Ccircle cx='57' cy='24' r='2.5' fill='%23000'/%3E%3Cpath d='M40 36 Q50 42 60 36' stroke='%23000' fill='none' stroke-width='2'/%3E%3Cpath d='M35 18 Q50 8 65 18' fill='%23bcaaa4'/%3E%3Crect x='35' y='46' width='30' height='40' fill='%23795548' rx='5'/%3E%3C/svg%3E"
  }
};

// ---------- GLOBAL STATE ----------
let scenes = [];
let selectedChar = 'boy';
let ffmpeg = null;
let ffmpegLoaded = false;

document.addEventListener('DOMContentLoaded', () => {
  console.log("✅ Page loaded — Urdu Cartoon Reel Studio ready.");
  document.getElementById('generateScriptBtn').addEventListener('click', generateScript);
  document.getElementById('previewScenesBtn').addEventListener('click', previewScenes);
  document.getElementById('makeReelBtn').addEventListener('click', createReel);
  buildCharPicker();
});

function buildCharPicker() {
  const picker = document.getElementById('charPicker');
  picker.innerHTML = '';
  for (let [key, ch] of Object.entries(characters)) {
    const div = document.createElement('div');
    div.className = 'char-option' + (key === selectedChar ? ' selected' : '');
    div.dataset.char = key;
    div.innerHTML = `<img src="${ch.img}" alt="${ch.name}"><br>${ch.name}`;
    div.onclick = () => {
      document.querySelectorAll('.char-option').forEach(el => el.classList.remove('selected'));
      div.classList.add('selected');
      selectedChar = key;
      scenes.forEach(s => s.charKey = key);
      updateSpeakerRows();
    };
    picker.appendChild(div);
  }
}

// ---------- STEP 1 ----------
function generateScript() {
  const theme = document.getElementById('theme').value;
  scenes = JSON.parse(JSON.stringify(storyDB[theme]));
  scenes.forEach(s => s.charKey = selectedChar);
  document.getElementById('scriptOutput').innerHTML = scenes.map(s =>
    `<b>${s.speaker}:</b> ${s.text}`
  ).join('<br>');
  document.getElementById('assignmentStep').style.display = 'block';
  document.getElementById('renderStep').style.display = 'none';
  buildSpeakerAssignments();
}

// ---------- STEP 2: BUILD SPEAKER ROWS ----------
function buildSpeakerAssignments() {
  const container = document.getElementById('speakerAssignments');
  container.innerHTML = '';
  const speakers = [...new Set(scenes.map(s => s.speaker))];
  speakers.forEach(speaker => {
    const div = document.createElement('div');
    div.className = 'speaker-row';
    const charImg = characters[selectedChar]?.img || '';
    div.innerHTML = `
      <img src="${charImg}" alt="character">
      <b>${speaker}</b>
      <input type="file" accept="audio/*" class="voice-upload" data-speaker="${speaker}">
    `;
    container.appendChild(div);
  });
}

function updateSpeakerRows() {
  const imgSrc = characters[selectedChar]?.img || '';
  document.querySelectorAll('.speaker-row img').forEach(img => img.src = imgSrc);
}

// ---------- PREVIEW ----------
function previewScenes() {
  // attach uploaded files to scenes
  const fileInputs = document.querySelectorAll('.voice-upload');
  fileInputs.forEach(inp => {
    const speaker = inp.dataset.speaker;
    const file = inp.files[0];
    if (file) {
      scenes.filter(s => s.speaker === speaker).forEach(s => s.voiceFile = file);
    }
  });

  const previewDiv = document.getElementById('scenePreviews');
  previewDiv.innerHTML = '';
  scenes.forEach((s, i) => {
    const char = characters[s.charKey];
    const div = document.createElement('div');
    div.className = 'scene-preview';
    div.innerHTML = `<img src="${char.img}" alt="${char.name}"> <span><b>${s.speaker}:</b> ${s.text}</span>`;
    previewDiv.appendChild(div);
  });
  document.getElementById('renderStep').style.display = 'block';
}

// ---------- STEP 3: CREATE REEL ----------
async function createReel() {
  // ensure voice files are assigned
  const fileInputs = document.querySelectorAll('.voice-upload');
  fileInputs.forEach(inp => {
    const speaker = inp.dataset.speaker;
    const file = inp.files[0];
    if (file) scenes.filter(s => s.speaker === speaker).forEach(s => s.voiceFile = file);
  });

  if (scenes.some(s => !s.voiceFile)) {
    alert('براہ کرم ہر کردار کے لیے آواز کی فائل اپ لوڈ کریں۔');
    return;
  }

  const progressDiv = document.getElementById('progress');
  const downloadLink = document.getElementById('downloadLink');
  downloadLink.style.display = 'none';

  if (!ffmpegLoaded) {
    progressDiv.textContent = 'FFmpeg لوڈ ہو رہا ہے (پہلی بار ~30MB)...';
    await loadFFmpeg();
  }

  try {
    // 1) Render scene images
    progressDiv.textContent = 'مناظر کی تصاویر بنا رہے ہیں...';
    const imageBlobs = [];
    for (let i = 0; i < scenes.length; i++) {
      const blob = await renderSceneImage(scenes[i]);
      imageBlobs.push(blob);
    }

    // 2) Get audio durations
    const durations = [];
    for (let i = 0; i < scenes.length; i++) {
      const audioCtx = new AudioContext();
      const arrayBuffer = await scenes[i].voiceFile.arrayBuffer();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      durations.push(audioBuffer.duration);
      audioCtx.close();
    }

    // 3) Write files to FFmpeg virtual FS
    for (let i = 0; i < scenes.length; i++) {
      await ffmpeg.writeFile(`scene${i}.png`, await fetchFile(imageBlobs[i]));
      await ffmpeg.writeFile(`audio${i}.mp3`, await fetchFile(scenes[i].voiceFile));
    }

    // 4) Build FFmpeg command
    let args = [];
    for (let i = 0; i < scenes.length; i++) {
      args.push('-loop', '1', '-t', durations[i].toFixed(3), '-i', `scene${i}.png`);
    }
    for (let i = 0; i < scenes.length; i++) {
      args.push('-i', `audio${i}.mp3`);
    }

    let videoInputs = '', audioInputs = '';
    for (let i = 0; i < scenes.length; i++) {
      videoInputs += `[${i}:v]`;
      audioInputs += `[${scenes.length + i}:a]`;
    }
    const filter = `${videoInputs}concat=n=${scenes.length}:v=1:a=0[outv]; ${audioInputs}concat=n=${scenes.length}:v=0:a=1[outa]`;
    args.push('-filter_complex', filter);
    args.push('-map', '[outv]', '-map', '[outa]');
    args.push('-c:v', 'libx264', '-preset', 'ultrafast', '-pix_fmt', 'yuv420p');
    args.push('-shortest', 'output.mp4');

    progressDiv.textContent = 'ویڈیو بن رہی ہے...';
    await ffmpeg.exec(args);

    const data = await ffmpeg.readFile('output.mp4');
    const blob = new Blob([data.buffer], { type: 'video/mp4' });
    const url = URL.createObjectURL(blob);
    downloadLink.href = url;
    downloadLink.style.display = 'block';
    progressDiv.textContent = '✔️ ریل تیار ہے! اوپر لنک سے ڈاؤن لوڈ کریں۔';
  } catch (err) {
    progressDiv.textContent = '❌ خرابی: ' + err.message;
  } finally {
    // Cleanup virtual files
    try { for (let i=0;i<scenes.length;i++) await ffmpeg.deleteFile(`scene${i}.png`); } catch(e){}
    try { for (let i=0;i<scenes.length;i++) await ffmpeg.deleteFile(`audio${i}.mp3`); } catch(e){}
    try { await ffmpeg.deleteFile('output.mp4'); } catch(e){}
  }
}

// ---------- FFMPEG LOAD ----------
async function loadFFmpeg() {
  ffmpeg = new FFmpeg();
  const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';
  await ffmpeg.load({
    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
  });
  ffmpegLoaded = true;
}

// ---------- CANVAS RENDERING ----------
async function renderSceneImage(scene) {
  const canvas = document.createElement('canvas');
  canvas.width = 1080;
  canvas.height = 1920;
  const ctx = canvas.getContext('2d');

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, 0, 1920);
  grad.addColorStop(0, '#1a237e');
  grad.addColorStop(1, '#4a148c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1080, 1920);

  // Load character image
  const charImg = new Image();
  charImg.src = characters[scene.charKey].img;
  await new Promise((resolve, reject) => { charImg.onload = resolve; charImg.onerror = reject; });
  ctx.drawImage(charImg, (1080-600)/2, 250, 600, 600);

  // Dialogue text
  ctx.fillStyle = 'white';
  ctx.font = 'bold 70px "Noto Nastaliq Urdu", "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.direction = 'rtl';
  wrapText(ctx, scene.text, 1080/2, 1350, 950, 90);

  // Speaker name
  ctx.font = '60px "Noto Nastaliq Urdu", sans-serif';
  ctx.fillStyle = '#ffeb3b';
  ctx.fillText(scene.speaker, 1080/2, 150);

  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

function wrapText(ctx, text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '';
  for (let n = 0; n < words.length; n++) {
    const test = line + words[n] + ' ';
    if (ctx.measureText(test).width > maxW && n > 0) {
      ctx.fillText(line, x, y);
      line = words[n] + ' ';
      y += lineH;
    } else line = test;
  }
  ctx.fillText(line, x, y);
}
</script>
</body>
</html>
