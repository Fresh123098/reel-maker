// =================== CHARACTER SVG GENERATOR ===================
function buildCharSVG({head='round', hair='short', skin='#f8c291', outfit='shirt', outfitColor='#3f51b5'}) {
  const headShape = head === 'round' 
    ? `<circle cx="50" cy="35" r="18" fill="${skin}" stroke="#333" stroke-width="1.5"/>`
    : `<ellipse cx="50" cy="35" rx="16" ry="20" fill="${skin}" stroke="#333" stroke-width="1.5"/>`;
  let hairSVG = '';
  if (hair === 'short') hairSVG = `<path d="M28 30 Q50 10 72 30" fill="#5d4037" stroke="#333" stroke-width="1"/>`;
  else if (hair === 'long') hairSVG = `<path d="M28 30 Q50 10 72 30" fill="#5d4037" stroke="#333" stroke-width="1"/><rect x="25" y="18" width="10" height="20" fill="#5d4037" rx="3"/>`;
  let outfitSVG = '';
  if (outfit === 'shirt') outfitSVG = `<rect x="35" y="53" width="30" height="35" fill="${outfitColor}" rx="5" stroke="#333" stroke-width="1"/>`;
  else if (outfit === 'dress') outfitSVG = `<path d="M35 53 L35 90 L65 90 L65 53 Q50 45 35 53" fill="${outfitColor}" stroke="#333" stroke-width="1"/>`;
  else if (outfit === 'kurta') outfitSVG = `<rect x="35" y="53" width="30" height="35" fill="${outfitColor}" rx="3" stroke="#333" stroke-width="1"/><rect x="38" y="55" width="8" height="25" fill="#fff" opacity="0.3"/>`;
  return `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="35" r="18" fill="${skin}" stroke="#333"/><circle cx="43" cy="32" r="2" fill="#000"/><circle cx="57" cy="32" r="2" fill="#000"/><path d="M45 40 Q50 45 55 40" stroke="#000" fill="none" stroke-width="2"/>${hairSVG}${outfitSVG}</svg>`)}`;
}

// =================== meSpeak SETUP ===================
function loadUrduVoice() {
  return new Promise((resolve, reject) => {
    if (meSpeakReady) return resolve();
    if (typeof meSpeak === 'undefined') {
      return reject('meSpeak not loaded. Wait a moment and refresh.');
    }
    meSpeak.loadConfig({
      amph: 100, pitch: 50, speed: 145, wordgap: 5, variant: 'f'
    });
    const voiceURL = 'https://cdn.jsdelivr.net/gh/kripken/speak.js@master/voices/ur.json';
    fetch(voiceURL)
      .then(res => res.json())
      .then(voiceData => {
        meSpeak.loadVoice(voiceData, () => {
          meSpeakReady = true;
          resolve();
        });
      })
      .catch(err => reject('Failed to load Urdu voice. Check your internet connection.'));
  });
}

async function generateTTSAudio(text) {
  await loadUrduVoice();
  return new Promise((resolve) => {
    const base64 = meSpeak.speak(text, { rawdata: 'data-url' });
    const byteString = atob(base64.split(',')[1]);
    const mimeString = 'audio/wav';
    const ab = new ArrayBuffer(byteString.length);
    const ia = new Uint8Array(ab);
    for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
    resolve(new Blob([ab], { type: mimeString }));
  });
}

function buildSpeakerUploads() {
  const container = document.getElementById('speakerUploads');

// =================== AI ASSISTANT ===================
function addAIMessage(text, sender) {
  const msgs = document.getElementById('aiMessages');
  const div = document.createElement('div');
  div.className = `msg ${sender}-msg`;
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function confirmAction(description, actionFn) {
  const msgs = document.getElementById('aiMessages');
  const confirmDiv = document.createElement('div');
  confirmDiv.className = 'confirm-box';
  confirmDiv.innerHTML = `<b>Proceed with:</b> ${description}<br>
    <button class="confirm-yes" style="margin-right:5px;">Yes</button>
    <button class="confirm-no">No</button>`;
  msgs.appendChild(confirmDiv);
  msgs.scrollTop = msgs.scrollHeight;
  confirmDiv.querySelector('.confirm-yes').onclick = () => {
    confirmDiv.remove();
    actionFn();
    addAIMessage('✅ Done!', 'bot');
  };
  confirmDiv.querySelector('.confirm-no').onclick = () => {
    confirmDiv.remove();
    addAIMessage('❌ Cancelled.', 'bot');
  };
}

function handleAIInput() {
  const input = document.getElementById('aiInput');
  const cmd = input.value.trim();
  if (!cmd) return;
  addAIMessage(cmd, 'user');
  input.value = '';
  processAICommand(cmd.toLowerCase());
}

function processAICommand(cmd) {
  if (cmd.includes('story') || cmd.includes('کہانی')) {
    let theme = 'funny';
    if (cmd.includes('funny') || cmd.includes('مضحکہ')) theme = 'funny';
    else if (cmd.includes('moral') || cmd.includes('اخلاقی')) theme = 'moral';
    else if (cmd.includes('islamic') || cmd.includes('اسلامی')) theme = 'islamic';
    else if (cmd.includes('friend') || cmd.includes('دوستی')) theme = 'friendship';
    const objs = [];
    if (cmd.includes('car') || cmd.includes('کار')) objs.push('car');
    if (cmd.includes('bike') || cmd.includes('موٹر')) objs.push('bike');
    if (cmd.includes('building') || cmd.includes('عمارت')) objs.push('building');
    if (cmd.includes('tree') || cmd.includes('درخت')) objs.push('tree');
    confirmAction(`Generate ${theme} story with objects: ${objs.join(', ') || 'none'}`, () => {
      document.getElementById('themeSelect').value = theme;
      scenes = JSON.parse(JSON.stringify(storyDB[theme]));
      scenes.forEach(s => s.charKey = selectedCharKey);
      document.getElementById('scriptOutput').innerHTML = scenes.map(s => `<b>${s.speaker}:</b> ${s.text}`).join('<br>');
      objs.forEach(o => {
        document.querySelector(`.obj-btn[data-obj="${o}"]`)?.classList.add('active');
        activeObjects.add(o);
      });
    });
  } else if (cmd.includes('character') || cmd.includes('کردار')) {
    const chars = Object.keys(characters);
    for (let key of chars) {
      if (cmd.includes(key) || cmd.includes(characters[key].name.toLowerCase())) {
        confirmAction(`Switch to ${characters[key].name}`, () => {
          document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
          const card = document.querySelector(`.char-card[data-key="${key}"]`);
          if (card) card.classList.add('selected');
          selectedCharKey = key;
          scenes.forEach(s => s.charKey = key);
        });
        return;
      }
    }
    addAIMessage('Unknown character. Try: boy, girl, man, woman, grandpa.', 'bot');
  } else if (cmd.includes('object') || cmd.includes('car') || cmd.includes('bike') || cmd.includes('building') || cmd.includes('tree')) {
    const map = { car:'car', bike:'bike', building:'building', tree:'tree' };
    for (let [word, obj] of Object.entries(map)) {
      if (cmd.includes(word)) {
        confirmAction(`Toggle ${obj}`, () => {
          const btn = document.querySelector(`.obj-btn[data-obj="${obj}"]`);
          if (btn) btn.click();
        });
        return;
      }
    }
  } else if (cmd.includes('music') || cmd.includes('موسیقی')) {
    if (cmd.includes('funny') || cmd.includes('مزاحیہ')) change('funny');
    else if (cmd.includes('sad') || cmd.includes('جذباتی')) change('sad');
    else if (cmd.includes('calm') || cmd.includes('پرسکون')) change('calm');
    else if (cmd.includes('upbeat') || cmd.includes('پرجوش')) change('upbeat');
    else addAIMessage('Music: funny, sad, calm, upbeat', 'bot');
    function change(mood) {
      confirmAction(`Set music to ${mood}`, () => document.getElementById('musicMood').value = mood);
    }
  } else if (cmd.includes('voice') || cmd.includes('آواز')) {
    if (cmd.includes('auto') || cmd.includes('خودکار')) {
      confirmAction('Generate auto Urdu voice', tryAutoVoice);
    } else {
      addAIMessage('Say "auto voice" to generate Urdu speech.', 'bot');
    }
  } else if (cmd.includes('download') || cmd.includes('ڈاؤن لوڈ')) {
    if (cmd.includes('youtube') || cmd.includes('یوٹیوب')) {
      confirmAction('Set platform to 16:9 YouTube and create reel', () => {
        document.getElementById('platformSelect').value = '16:9';
        createReel();
      });
    } else if (cmd.includes('tiktok') || cmd.includes('ٹک ٹاک') || cmd.includes('reel')) {
      confirmAction('Set platform to 9:16 vertical and create reel', () => {
        document.getElementById('platformSelect').value = '9:16';
        createReel();
      });
    } else if (cmd.includes('facebook') || cmd.includes('فیس بک')) {
      confirmAction('Set platform to 1:1 square and create reel', () => {
        document.getElementById('platformSelect').value = '1:1';
        createReel();
      });
    } else {
      confirmAction('Create reel with current settings', createReel);
    }
  } else if (cmd.includes('preview') || cmd.includes('پیش منظر')) {
    confirmAction('Preview scenes', previewScenes);
  } else if (cmd.includes('help') || cmd.includes('مدد')) {
    addAIMessage('I understand: story (funny/moral/islamic/friendship), characters (boy/girl/man/woman/grandpa), objects (car/bike/building/tree), music (funny/sad/calm/upbeat), auto voice, download for youtube/tiktok/facebook, preview.', 'bot');
  } else {
    addAIMessage('I didn\'t understand. Try "create funny story" or "help".', 'bot');
  }
}

// =================== VOICE & PREVIEW & REEL ===================
async function tryAutoVoice() {
  try {
    await loadUrduVoice();
    const status = document.getElementById('voiceStatus');
    status.textContent = 'Generating Urdu voice...';
    autoAudioBlobs = [];
    for (let i = 0; i < scenes.length; i++) {
      const blob = await generateTTSAudio(scenes[i].text);
      autoAudioBlobs.push(blob);
    }
    status.textContent = '✔️ Auto voice ready!';
    voiceMode = 'auto';
    alert('Urdu voiceover generated! Now you can create the reel.');
  } catch (e) {
    alert('Auto voice failed: ' + e.message);
  }
}

function previewScenes() {
  if (voiceMode !== 'auto') {
    document.querySelectorAll('.voice-upload').forEach(inp => {
      const speaker = inp.dataset.speaker;
      const file = inp.files[0];
      if (file) scenes.filter(s => s.speaker === speaker).forEach(s => s.voiceFile = file);
    });
  }
  const previewDiv = document.getElementById('scenePreviews');
  previewDiv.innerHTML = '';
  scenes.forEach(s => {
    const char = characters[s.charKey];
    const div = document.createElement('div');
    div.className = 'scene-preview';
    div.innerHTML = `<img src="${char.img}"><span><b>${s.speaker}:</b> ${s.text}</span>`;
    previewDiv.appendChild(div);
  });
}

async function createReel() {
  const progress = document.getElementById('progress');
  const downloadLink = document.getElementById('downloadLink');
  downloadLink.style.display = 'none';

  if (voiceMode !== 'auto') {
    document.querySelectorAll('.voice-upload').forEach(inp => {
      const speaker = inp.dataset.speaker;
      const file = inp.files[0];
      if (file) scenes.filter(s => s.speaker === speaker).forEach(s => s.voiceFile = file);
    });
  } else {
    if (autoAudioBlobs.length !== scenes.length) {
      alert('Please generate the voice first.');
      return;
    }
    scenes.forEach((s, i) => s.voiceFile = autoAudioBlobs[i]);
  }
  if (scenes.some(s => !s.voiceFile)) {
    alert('Please provide a voice file for every speaker.');
    return;
  }

  if (!ffmpegLoaded) {
    progress.textContent = 'Loading FFmpeg (one time ~30MB)...';
    await loadFFmpeg();
  }

  try {
    const platform = document.getElementById('platformSelect').value;
    let width = 1080, height = 1920;
    if (platform === '16:9') { width = 1920; height = 1080; }
    else if (platform === '1:1') { width = 1080; height = 1080; }

    const musicMood = document.getElementById('musicMood').value;
    const musicBuffer = await generateMusic(musicMood, 30);
    const musicBlob = new Blob([audioBufferToWav(musicBuffer)], { type: 'audio/wav' });

    const imageBlobs = [];
    for (let i = 0; i < scenes.length; i++) {
      const blob = await renderScene(scenes[i], width, height, Array.from(activeObjects), selectedBg);
      imageBlobs.push(blob);
    }
    const endText = document.getElementById('endScreenText').value || "Fazal's Reels";
    const endBlob = await renderEndScreen(endText, width, height);
    const endDuration = 2;

    for (let i = 0; i < scenes.length; i++) {
      await ffmpeg.writeFile(`scene${i}.png`, await fetchFile(imageBlobs[i]));
      await ffmpeg.writeFile(`audio${i}.wav`, await fetchFile(scenes[i].voiceFile));
    }
    await ffmpeg.writeFile('end.png', await fetchFile(endBlob));
    await ffmpeg.writeFile('music.wav', await fetchFile(musicBlob));

    const durations = [];
    for (let i = 0; i < scenes.length; i++) {
      const ctx = new AudioContext();
      const buf = await ctx.decodeAudioData(await scenes[i].voiceFile.arrayBuffer());
      durations.push(buf.duration);
      ctx.close();
    }

    let args = [];
    for (let i = 0; i < scenes.length; i++) args.push('-loop', '1', '-t', durations[i].toFixed(3), '-i', `scene${i}.png`);
    for (let i = 0; i < scenes.length; i++) args.push('-i', `audio${i}.wav`);
    args.push('-i', 'music.wav');
    args.push('-loop', '1', '-t', endDuration.toFixed(1), '-i', 'end.png');

    let vIn = '', aIn = '';
    for (let i = 0; i < scenes.length; i++) { vIn += `[${i}:v]`; aIn += `[${scenes.length + i}:a]`; }
    const vConcat = `${vIn}[${scenes.length*2+2}:v]concat=n=${scenes.length+1}:v=1:a=0[mainv]`;
    const aConcat = `${aIn}concat=n=${scenes.length}:v=0:a=1[speech]; anullsrc=r=44100:cl=stereo:d=${endDuration}[silence]; [speech][silence]concat=n=2:v=0:a=1[maina]`;
    const mix = `[maina][${scenes.length*2+1}:a]amix=inputs=2:duration=first:dropout_transition=2[mixa]`;
    args.push('-filter_complex', `${vConcat}; ${aConcat}; ${mix}`);
    args.push('-map', '[mainv]', '-map', '[mixa]');
    args.push('-c:v', 'libx264', '-preset', 'ultrafast', '-pix_fmt', 'yuv420p');
    args.push('-shortest', 'output.mp4');

    progress.textContent = 'Creating reel...';
    await ffmpeg.exec(args);

    const data = await ffmpeg.readFile('output.mp4');
    const blob = new Blob([data.buffer], { type: 'video/mp4' });
    downloadLink.href = URL.createObjectURL(blob);
    downloadLink.style.display = 'block';
    progress.textContent = '✔️ Reel ready! Download above.';
  } catch (e) {
    progress.textContent = '❌ Error: ' + e.message;
  } finally {
    // cleanup
    for (let i = 0; i < scenes.length; i++) {
      try { await ffmpeg.deleteFile(`scene${i}.png`); } catch(e){}
      try { await ffmpeg.deleteFile(`audio${i}.wav`); } catch(e){}
    }
    try { await ffmpeg.deleteFile('end.png'); } catch(e){}
    try { await ffmpeg.deleteFile('music.wav'); } catch(e){}
    try { await ffmpeg.deleteFile('output.mp4'); } catch(e){}
  }
}

// =================== SCENE RENDERING ===================
async function renderScene(scene, w, h, objects=[], bg='gradient') {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');

  // Backgrounds
  if (bg === 'home') drawHomeBg(ctx, w, h);
  else if (bg === 'school') drawSchoolBg(ctx, w, h);
  else if (bg === 'mosque') drawMosqueBg(ctx, w, h);
  else if (bg === 'park') drawParkBg(ctx, w, h);
  else {
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#1a237e'); grad.addColorStop(1, '#4a148c');
    ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
  }

  // Objects
  objects.forEach(obj => {
    if (obj === 'car') { ctx.fillStyle='#f44336'; ctx.fillRect(w*0.1, h*0.75, 200, 100); ctx.fillStyle='#000'; ctx.fillRect(w*0.15, h*0.73, 30, 30); ctx.fillRect(w*0.35, h*0.73, 30, 30); }
    if (obj === 'bike') { ctx.fillStyle='#ff9800'; ctx.fillRect(w*0.7, h*0.8, 100, 60); }
    if (obj === 'building') { ctx.fillStyle='#607d8b'; ctx.fillRect(w*0.6, h*0.4, 300, h*0.6); }
    if (obj === 'tree') { ctx.fillStyle='#4caf50'; ctx.beginPath(); ctx.arc(w*0.2, h*0.6, 80, 0, Math.PI*2); ctx.fill(); }
  });

  // Character
  const charImg = new Image();
  charImg.src = characters[scene.charKey].img;
  await new Promise((resolve) => { charImg.onload = resolve; charImg.onerror = resolve; });
  ctx.drawImage(charImg, (w - w*0.4)/2, h*0.25, w*0.4, w*0.4);

  // Text
  ctx.fillStyle = 'white';
  ctx.font = `bold ${w*0.06}px "Noto Nastaliq Urdu", "Segoe UI", sans-serif`;
  ctx.textAlign = 'center';
  ctx.direction = 'rtl';
  wrapText(ctx, scene.text, w/2, h*0.75, w*0.8, w*0.08);

  // Speaker
  ctx.font = `${w*0.05}px sans-serif`;
  ctx.fillStyle = '#ffeb3b';
  ctx.fillText(scene.speaker, w/2, h*0.1);

  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

function wrapText(ctx, text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '';
  for (let n = 0; n < words.length; n++) {
    const test = line + words[n] + ' ';
    if (ctx.measureText(test).width > maxW && n > 0) {
      ctx.fillText(line, x, y);
      line = words[n] + ' ';
      y += lineH;
    } else line = test;
  }
  ctx.fillText(line, x, y);
}

function drawHomeBg(ctx, w, h) {
  ctx.fillStyle = '#87CEEB'; ctx.fillRect(0,0,w,h); // sky
  ctx.fillStyle = '#8B4513'; ctx.fillRect(0,h*0.6,w,h*0.4); // floor
  ctx.fillStyle = '#F5DEB3'; ctx.fillRect(w*0.4, h*0.4, w*0.3, h*0.3); // house
}
function drawSchoolBg(ctx, w, h) {
  ctx.fillStyle = '#87CEEB'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = '#808080'; ctx.fillRect(0,h*0.7,w,h*0.3);
  ctx.fillStyle = '#FFD700'; ctx.fillRect(w*0.3, h*0.4, w*0.4, h*0.3);
}
function drawMosqueBg(ctx, w, h) {
  ctx.fillStyle = '#4682B4'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = '#F5F5DC'; ctx.fillRect(0,h*0.6,w,h*0.4);
  ctx.fillStyle = '#006400'; ctx.beginPath(); ctx.arc(w*0.5, h*0.3, 80, Math.PI, 0); ctx.fill();
}
function drawParkBg(ctx, w, h) {
  ctx.fillStyle = '#87CEEB'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = '#228B22'; ctx.fillRect(0,h*0.5,w,h*0.5);
  ctx.fillStyle = '#8B4513'; ctx.fillRect(w*0.4, h*0.7, 40, h*0.2);
}

async function renderEndScreen(text, w, h) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#1a237e'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = 'white';
  ctx.font = `bold ${w*0.08}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(text, w/2, h/2);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

// =================== MUSIC GENERATOR ===================
async function generateMusic(mood, durationSec) {
  const ctx = new OfflineAudioContext(1, 44100 * durationSec, 44100);
  const bpm = {funny:140, moral:80, islamic:70, friendship:120}[mood] || 100;
  const beatLen = 60 / bpm;
  const osc = ctx.createOscillator();
  osc.type = 'triangle';
  const gain = ctx.createGain();
  gain.gain.value = 0.1;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(0);
  osc.stop(durationSec);
  for (let t = 0; t < durationSec; t += beatLen) {
    gain.gain.setValueAtTime(0.15, t);
    gain.gain.linearRampToValueAtTime(0, t + beatLen * 0.3);
  }
  return ctx.startRendering();
}

// =================== AUDIO UTILS ===================
function audioBufferToWav(buffer) {
  const numChannels = buffer.numberOfChannels, sampleRate = buffer.sampleRate, bitDepth = 16;
  const bytesPerSample = bitDepth / 8, blockAlign = numChannels * bytesPerSample;
  const data = buffer.getChannelData(0);
  const dataLength = data.length * bytesPerSample, bufferLength = 44 + dataLength;
  const arrayBuffer = new ArrayBuffer(bufferLength);
  const view = new DataView(arrayBuffer);
  writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + dataLength, true);
  writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true); view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitDepth, true); writeString(view, 36, 'data');
  view.setUint32(40, dataLength, true);
  const offset = 44;
  for (let i = 0; i < data.length; i++) {
    const sample = Math.max(-1, Math.min(1, data[i]));
    view.setInt16(offset + i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
  }
  return arrayBuffer;
}
function writeString(view, offset, string) {
  for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
}

// =================== FFMPEG ===================
async function loadFFmpeg() {
  ffmpeg = new FFmpeg();
  const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';
  await ffmpeg.load({
    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
  });
  ffmpegLoaded = true;
}
